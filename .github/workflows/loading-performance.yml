name: loading-performance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: artex_isolated_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:synthetic_ci_only@127.0.0.1:5432/artex_isolated_test?sslmode=disable
      NEXT_TELEMETRY_DISABLED: '1'
      ARTEX_REGRESSION_BASE: acc826c95ad5ce39b09160af050b23c868e663b5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format changed Go sources remotely
        run: |
          gofmt -w taskbrowser/*.go agent/browser_env.go server/task_browser*.go server/assembly.go server/server.go agent/worker.go agent/planner.go agent/mainagent.go
          gofmt -w db/loading*test.go db/exploration.go db/intercept.go db/task_assets.go db/task_assets_context.go server/intercept.go server/server.go server/task_assets.go server/request_timing*.go
          gofmt -w db/tasks.go db/assets.go db/task_archives.go db/task_delete*test.go db/task_list_performance_test.go server/manager.go server/manager_delete_files_test.go server/server_mgmt.go
          git diff > gofmt.patch
      - name: Task browser concurrency and lifecycle
        run: |
          go test -race ./taskbrowser -timeout 120s -count=1 -v > browser-tests.log 2>&1
          test -x /opt/google/chrome/chrome
          ARTEX_BROWSER_EXECUTABLE=/opt/google/chrome/chrome go test ./taskbrowser -timeout 120s -run TestRealBrowserLifecycle -count=1 -v >> browser-tests.log 2>&1
          go test ./server -run TestTaskBrowserRules -count=1 -v >> browser-tests.log
          npm install -g @playwright/mcp@0.0.83
          ARTEX_BROWSER_EXECUTABLE=/opt/google/chrome/chrome ARTEX_BROWSER_MCP_SMOKE=1 go test ./server -run TestTaskBrowserMCPUsesManagedInstance -count=1 -v >> browser-tests.log
      - name: Backend regression and scope benchmark
        run: bash scripts/verify-backend.sh ${{ job.services.postgres.id }}
      - name: Request and polling recovery tests
        run: node --experimental-strip-types --test scripts/loading-tests.mjs
      - name: Upstream title and traffic regression
        run: |
          go test ./agent -run TestGenerateAutoTitle -count=1 -v > feature-tests.log
          go test ./traffic -count=1 -v >> feature-tests.log
          go test ./agent -run 'TestDeepSeek|TestJev|TestTerminalReason' -count=1 -v >> feature-tests.log
          go test ./agent -run TestTaskAssetSharingLiveToolPolicy -count=1 -v >> feature-tests.log
          go test ./intercept/... ./llmhttp ./selfupdate -count=1 -v >> feature-tests.log
      - run: npm ci
        working-directory: web
      - name: Upstream findings regression
        run: |
          node --experimental-strip-types --test src/lib/finding-severity.test.mjs
          node --test src/lib/mock/finding-time-sort.test.cjs
          node --test src/lib/api-version.test.cjs src/lib/api-proxy-pool.test.cjs
        working-directory: web
      - name: Export production frontend
        run: npm run build:static
        working-directory: web
      - name: Browser regression
        run: |
          npm install --prefix "$RUNNER_TEMP/artex-browser" playwright@1.56.1
          "$RUNNER_TEMP/artex-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/artex-browser/node_modules/playwright/index.mjs" node scripts/loading-browser.mjs
      - name: Build pinned Linux binary
        run: |
          mkdir -p server/webui/dist
          cp -a web/out/. server/webui/dist/
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embedui -ldflags '-s -w -X main.version=v0.3.27' -o dist/artex ./cmd/artex
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o dist/task-browser.test ./taskbrowser
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o dist/browser-server.test ./server
          cp scripts/install-browser-guard.sh dist/
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit
          (cd dist && sha256sum artex > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loading-verification
          path: |
            backend-tests.log
            feature-tests.log
            baseline-tests.log
            baseline-server-tests.log
            gofmt.patch
            browser-tests.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: artex-linux-amd64-${{ github.sha }}
          path: dist/
          retention-days: 7
