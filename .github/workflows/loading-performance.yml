name: loading-performance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: artex_isolated_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:synthetic_ci_only@127.0.0.1:5432/artex_isolated_test?sslmode=disable
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format changed Go sources remotely
        run: |
          gofmt -w db/loading*test.go db/exploration.go db/intercept.go db/task_assets.go db/task_assets_context.go server/intercept.go server/server.go server/task_assets.go server/request_timing*.go
          git diff > gofmt.patch
      - name: Backend regression and scope benchmark
        run: |
          if go test -p 1 ./db ./server -skip '^TestWorkerPoolSettingsRoundTrip$' -count=1 -v > backend-tests.log 2>&1; then
            echo 'backend suite passed'
          else
            # 在独立数据库复核主分支，区分存量失败与本次回归。
            git fetch --depth=1 origin main
            git worktree add --detach "$RUNNER_TEMP/artex-baseline" FETCH_HEAD
            docker exec ${{ job.services.postgres.id }} createdb -U artex_test artex_baseline_test
            (cd "$RUNNER_TEMP/artex-baseline" && ARTEX_PG_DSN='postgres://artex_test:synthetic_ci_only@127.0.0.1:5432/artex_baseline_test?sslmode=disable' go test ./db -count=1 -v -run '^(TestInterceptApprovalFilters|TestSideTaskArchiveVersions)$') > baseline-tests.log 2>&1 || true
            python3 - <<'PYTEST'
          import pathlib,re
          failures=lambda name:set(re.findall(r'^--- FAIL: (\S+)',pathlib.Path(name).read_text(),re.M))
          current,baseline=failures('backend-tests.log'),failures('baseline-tests.log')
          print('current failures:',sorted(current),'baseline failures:',sorted(baseline))
          assert current and current<=baseline, 'new backend regression'
          PYTEST
          fi
          # 该用例会恢复数据库里全部未结束任务；使用空库避免其它用例的后台写入污染临时目录。
          docker exec ${{ job.services.postgres.id }} createdb -U artex_test artex_worker_pool_test
          ARTEX_PG_DSN='postgres://artex_test:synthetic_ci_only@127.0.0.1:5432/artex_worker_pool_test?sslmode=disable' go test ./server -count=1 -v -run '^TestWorkerPoolSettingsRoundTrip$' >> backend-tests.log 2>&1
          grep -E 'TestLoading|old_ms=|TestRequestTiming|TestWorkerPoolSettingsRoundTrip' backend-tests.log
      - name: Request and polling recovery tests
        run: node --experimental-strip-types --test scripts/loading-tests.mjs
      - run: npm ci
        working-directory: web
      - name: Export production frontend
        run: npm run build:static
        working-directory: web
      - name: Browser regression
        run: |
          npm install --prefix "$RUNNER_TEMP/artex-browser" playwright@1.56.1
          "$RUNNER_TEMP/artex-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/artex-browser/node_modules/playwright/index.mjs" node scripts/loading-browser.mjs
      - name: Build pinned Linux binary
        run: |
          mkdir -p server/webui/dist
          cp -a web/out/. server/webui/dist/
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embedui -ldflags '-s -w -X main.version=v0.3.24' -o dist/artex ./cmd/artex
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit
          (cd dist && sha256sum artex > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loading-verification
          path: |
            backend-tests.log
            baseline-tests.log
            gofmt.patch
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: artex-linux-amd64-${{ github.sha }}
          path: dist/
          retention-days: 7
