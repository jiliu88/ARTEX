# 包含在 ARTEX 的 HTTPS server 块中，复用已有登录校验。
location = /browser {
    return 302 /browser/vnc.html?autoconnect=1&resize=remote&path=browser/websockify;
}
location = /browser/ {
    return 302 /browser/vnc.html?autoconnect=1&resize=remote&path=browser/websockify;
}
location /browser/ {
    auth_request /_anything_auth;
    error_page 401 = @anything_login;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $artex_connection_upgrade;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass http://172.29.240.10:6080/;
}
