name: artex-gmail
services:
  gmail:
    build: .
    image: artex-gmail:test-mail
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports: ["127.0.0.1:8793:8793"]
    volumes: ["./data:/data"]
    environment:
      PUBLIC_UI: "https://104.207.150.173:8443/gmail/"
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        aliases: [gmail]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8793/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  default:
    external: true
    name: artex_default
